name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          # Deliberately no pip cache: this repo exists to measure what a cold
          # environment costs, and a warm wheel cache would hide exactly that.
          # Add `cache: pip` here if you would rather have fast CI than a
          # representative number.

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          start=$(date +%s)
          pip install --no-cache-dir -r requirements.txt
          echo "INSTALL_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Run pytest
        run: python -m pytest -q --junit-xml=report.xml

      - name: Summarise timings
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          from collections import defaultdict
          import xml.etree.ElementTree as ET
          from pathlib import Path

          print("### pytest\n")
          install = os.environ.get("INSTALL_SECONDS")
          if install:
              print(f"- Dependency install: **{install}s** (cold, `--no-cache-dir`)")

          report = Path("report.xml")
          if not report.exists():
              print("- No JUnit report: the run failed before pytest wrote one.")
              raise SystemExit

          root = ET.parse(report).getroot()
          suite = root.find("testsuite") if root.tag == "testsuites" else root
          total = int(suite.get("tests"))
          bad = int(suite.get("failures") or 0) + int(suite.get("errors") or 0)
          skipped = int(suite.get("skipped") or 0)
          print(f"- Tests: **{total}** \u2014 {total - bad - skipped} passed, {bad} failed, {skipped} skipped")
          print(f"- Wall clock: **{float(suite.get('time')):.2f}s**")

          # Group by file. The two suites answer different questions: the sleep
          # tests measure scheduling, the heavy ones measure import cost.
          seconds, counts = defaultdict(float), defaultdict(int)
          for tc in suite.iter("testcase"):
              name = tc.get("classname")
              seconds[name] += float(tc.get("time") or 0.0)
              counts[name] += 1

          def split(pred):
              files = [f for f in seconds if pred(f)]
              return sum(counts[f] for f in files), sum(seconds[f] for f in files)

          sleep_n, sleep_s = split(lambda f: not f.startswith("tests.heavy"))
          heavy_n, heavy_s = split(lambda f: f.startswith("tests.heavy"))
          if sleep_n and heavy_n:
              print(f"- CPU suite: {sleep_n} tests, {sleep_s:.2f}s \u00b7 "
                    f"Heavy suite: {heavy_n} tests, {heavy_s:.2f}s")
          print()

          print("| File | Tests | Seconds |")
          print("| --- | ---: | ---: |")
          for name in sorted(seconds, key=lambda f: -seconds[f]):
              print(f"| `{name}` | {counts[name]} | {seconds[name]:.3f} |")
          PY

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: report.xml
          if-no-files-found: warn
